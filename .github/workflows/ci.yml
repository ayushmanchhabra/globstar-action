name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-version-latest:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm install

      - name: Check for linting errors
        run: npm run lint

      - name: Build action
        run: npm run dist

      - name: Setup Globstar
        uses: ./
        with:
          auth-token: ${{ secrets.GITHUB_TOKEN }}
          version: "latest"

      - name: Check that Globstar runs
        run: globstar --version


  test-version-specific:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm install

      - name: Check for linting errors
        run: npm run lint

      - name: Build action
        run: npm run dist

      - name: Setup Globstar
        uses: ./
        with:
          auth-token: ${{ secrets.GITHUB_TOKEN }}
          version: "0.4.1"

      - name: Check that Globstar runs
        run: globstar --version


  test-cache-option:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm install

      - name: Check for linting errors
        run: npm run lint

      - name: Build action
        run: npm run dist

      - name: Setup Globstar
        uses: ./
        with:
          auth-token: ${{ secrets.GITHUB_TOKEN }}
          version: "latest"
          cache: true

      - name: Check that Globstar runs
        run: globstar --version
